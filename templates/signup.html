<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Your Account | FlexSpace</title>
    <!-- Tailwind CSS v4 Browser/Play CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        /* Small interactive logic script placeholder fallback styling */
        .account-type-card { transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); }
        input[type="radio"]:checked + .account-type-card {
            border-color: var(--color-indigo-600);
            background-color: var(--color-indigo-50\/30);
            box-shadow: var(--shadow-sm);
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased min-h-screen flex flex-col justify-center py-12 sm:px-6 lg:px-8">

    <div class="sm:mx-auto sm:w-full sm:max-w-md text-center">
        <span class="text-2xl font-bold text-indigo-600 tracking-tight">FlexSpace</span>
        <h2 class="mt-4 text-3xl font-extrabold text-slate-900 tracking-tight">Get started with FlexSpace</h2>
        <p class="mt-2 text-sm text-slate-500">
            Already have an account? 
            <a href="#" class="font-medium text-indigo-600 hover:text-indigo-500 transition-colors">Sign in</a>
        </p>
    </div>

    <div class="mt-8 sm:mx-auto sm:w-full sm:max-w-xl">
        <div class="bg-white py-8 px-4 border border-slate-200 shadow-sm rounded-2xl sm:px-10">
            <form action="#" method="POST" class="space-y-6">
                
                <!-- Two-Way Selection Strategy Block -->
                <div>
                    <label class="text-sm font-semibold text-slate-900 block mb-3">Choose your account perspective</label>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        
                        <!-- Track Option 1: Client / Employer -->
                        <label class="relative cursor-pointer">
                            <input type="radio" name="account_type" value="client" class="sr-only peer" checked>
                            <div class="account-type-card p-5 border border-slate-200 rounded-xl hover:border-slate-300 peer-checked:border-indigo-600 peer-checked:bg-indigo-50/40">
                                <div class="flex items-center justify-between mb-2">
                                    <span class="text-2xl">💼</span>
                                    <div class="w-4 h-4 rounded-full border border-slate-300 flex items-center justify-center peer-checked:bg-indigo-600">
                                        <div class="w-2 h-2 rounded-full bg-white hidden peer-checked:block"></div>
                                    </div>
                                </div>
                                <span class="font-bold text-slate-900 block text-base">I am a Client</span>
                                <span class="text-xs text-slate-500 mt-1 block">Looking to scale, source infrastructure, or manage operational teams.</span>
                            </div>
                        </label>

                        <!-- Track Option 2: Individual / Creator -->
                        <label class="relative cursor-pointer">
                            <input type="radio" name="account_type" value="creator" class="sr-only peer">
                            <div class="account-type-card p-5 border border-slate-200 rounded-xl hover:border-slate-300 peer-checked:border-indigo-600 peer-checked:bg-indigo-50/40">
                                <div class="flex items-center justify-between mb-2">
                                    <span class="text-2xl">🎨</span>
                                    <div class="w-4 h-4 rounded-full border border-slate-300 flex items-center justify-center"></div>
                                </div>
                                <span class="font-bold text-slate-900 block text-base">I am a Creator</span>
                                <span class="text-xs text-slate-500 mt-1 block">Looking for workspace tools, shared assets, or launch workflows.</span>
                            </div>
                        </label>

                    </div>
                </div>

                <!-- Credential Input Fields -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label for="first_name" class="block text-sm font-medium text-slate-700 mb-1">First name</label>
                        <input id="first_name" name="first_name" type="text" required class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm shadow-xs placeholder-slate-400 focus:outline-hidden focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500">
                    </div>
                    <div>
                        <label for="last_name" class="block text-sm font-medium text-slate-700 mb-1">Last name</label>
                        <input id="last_name" name="last_name" type="text" required class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm shadow-xs placeholder-slate-400 focus:outline-hidden focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500">
                    </div>
                </div>

                <div>
                    <label for="email" class="block text-sm font-medium text-slate-700 mb-1">Email address</label>
                    <input id="email" name="email" type="email" autocomplete="email" required class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm shadow-xs placeholder-slate-400 focus:outline-hidden focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500" placeholder="you@example.com">
                </div>

                <div>
                    <label for="password" class="block text-sm font-medium text-slate-700 mb-1">Password</label>
                    <input id="password" name="password" type="password" autocomplete="new-password" required class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm shadow-xs placeholder-slate-400 focus:outline-hidden focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500" placeholder="••••••••">
                    <span class="text-xs text-slate-400 mt-1 block">Must be at least 8 characters long.</span>
                </div>

                <!-- Terms and Consents -->
                <div class="flex items-start">
                    <div class="flex items-center h-5">
                        <input id="terms" name="terms" type="checkbox" required class="h-4 w-4 text-indigo-600 border-slate-300 rounded-sm focus:ring-indigo-500">
                    </div>
                    <div class="ml-3 text-sm">
                        <label for="terms" class="text-slate-500">I agree to the <a href="#" class="text-indigo-600 hover:underline">Terms of Service</a> and <a href="#" class="text-indigo-600 hover:underline">Privacy Policy</a>.</label>
                    </div>
                </div>

                <!-- Primary Action -->
                <div>
                    <button type="submit" class="w-full flex justify-center py-2.5 px-4 border border-transparent rounded-lg shadow-sm text-sm font-semibold text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-hidden focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition-colors cursor-pointer">
                        Create Account
                    </button>
                </div>
            </form>

            <!-- Social Authentication Divider -->
            <div class="mt-6">
                <div class="relative flex items-center justify-center">
                    <div class="absolute inset-0 flex items-center">
                        <div class="w-full border-t border-slate-200"></div>
                    </div>
                    <span class="relative bg-white px-3 text-xs text-slate-400 uppercase tracking-wider">Or register with</span>
                </div>

                <div class="mt-4 grid grid-cols-2 gap-3">
                    <a href="#" class="w-full inline-flex justify-center py-2 px-4 border border-slate-200 rounded-lg bg-white text-sm font-medium text-slate-600 hover:bg-slate-50 shadow-2xs transition-colors">
                        Google
                    </a>
                    <a href="#" class="w-full inline-flex justify-center py-2 px-4 border border-slate-200 rounded-lg bg-white text-sm font-medium text-slate-600 hover:bg-slate-50 shadow-2xs transition-colors">
                        GitHub
                    </a>
                </div>
            </div>

        </div>
    </div>

</body>
</html>
